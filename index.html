<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cat Naps</title>
<meta name="description" content="A sequential interaction prototype: open the curtain, smooth the cushion, hush the room, and the cat sleeps.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,400&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="phone">
<svg id="stage" viewBox="0 0 390 844" role="application" aria-label="Cat Naps: open the curtain, smooth the cushion, hush the room">
 <defs>
  <clipPath id="screenClip"><rect x="0" y="0" width="390" height="844"/></clipPath>
  <clipPath id="winClip"><rect x="54" y="150" width="282" height="300" rx="10"/></clipPath>
  <linearGradient id="beamG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="var(--sun)" stop-opacity=".95"/>
    <stop offset="1" stop-color="var(--sun)" stop-opacity=".25"/>
  </linearGradient>
 </defs>
 <rect x="0" y="0" width="390" height="844" fill="var(--wall)"/>

 <!-- header -->
 <text x="28" y="58" font-size="11" fill="var(--mid)" letter-spacing="1.6">CAT NAPS</text>
 <text class="title" id="headline" x="28" y="92" font-size="30" fill="var(--ink)">Open the curtain</text>
 <g id="steps"></g>
 <g id="resetAll" class="hit" tabindex="0" role="button" aria-label="Start over">
   <circle class="focus" cx="352" cy="68" r="20" fill="var(--faint)"/>
   <path d="M361 68a9 9 0 1 1-3-6.7" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/>
   <path d="M358.5 56.5v5.5h-5.5" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
 </g>

 <g clip-path="url(#screenClip)">
 <!-- ===== scene 1: open the curtain (drag) ===== -->
 <g id="s1" class="scene">
   <rect x="54" y="150" width="282" height="300" rx="10" fill="#f6f1e6" stroke="var(--ink)" stroke-width="4"/>
   <g clip-path="url(#winClip)">
     <rect id="sky" x="54" y="150" width="282" height="300" fill="#f6f1e6"/>
     <circle id="sun" cx="250" cy="215" r="26" fill="var(--sun)" stroke="var(--soft)" stroke-width="2"/>
     <path d="M54 400 l60 -58 l52 48 l44 -36 l60 54 l66 -40 v82 H54 Z" fill="#bdab93"/>
     <g id="curtain">
       <rect id="cBody" x="54" y="150" width="282" height="300" fill="#b9a98f"/>
       <g id="cFolds" stroke="#9c8d74" stroke-width="3" fill="none"></g>
     </g>
   </g>
   <line x1="46" y1="150" x2="344" y2="150" stroke="var(--ink)" stroke-width="7" stroke-linecap="round"/>
   <rect x="54" y="150" width="282" height="300" rx="10" fill="none" stroke="var(--ink)" stroke-width="4"/>
   <path id="beam" fill="url(#beamG)"/>
   <g id="motes" fill="#fff8e4"></g>
   <rect x="0" y="560" width="390" height="284" fill="var(--floor)"/>
   <g id="boards" stroke="#b9a489" stroke-width="2"></g>
   <ellipse id="rug" cx="196" cy="668" rx="126" ry="40" fill="#d8c8b0" stroke="var(--mid)" stroke-width="3" stroke-dasharray="9 7"/>
   <g id="cat1"></g>
   <g id="edge" class="grab" tabindex="0" role="slider" aria-label="Curtain. Drag it open. Arrow keys also work." aria-valuemin="0" aria-valuemax="100" aria-valuenow="4">
     <rect class="focus" id="edgeHit" x="300" y="150" width="76" height="300" fill="transparent"/>
     <g id="pull">
       <rect x="324" y="150" width="12" height="300" rx="6" fill="var(--ink)" opacity=".85"/>
       <circle cx="330" cy="300" r="13" fill="var(--ink)"/>
       <path d="M326 294 l-5 6 l5 6 M334 294 l5 6 l-5 6" stroke="var(--wall)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
     </g>
     <circle id="hint1" cx="330" cy="300" r="0" fill="none" stroke="var(--accent)" stroke-width="2" opacity="0"/>
   </g>
   <g id="glare" opacity="0"><circle cx="196" cy="800" r="20" fill="none" stroke="var(--ink)" stroke-width="3"/><path d="M189 793 l14 14 M203 793 l-14 14" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/></g>
 </g>

 <!-- ===== scene 2: smooth the cushion (swipe) ===== -->
 <g id="s2" class="scene" transform="translate(390 0)">
   <rect x="0" y="560" width="390" height="284" fill="var(--floor)"/>
   <g id="boards2" stroke="#b9a489" stroke-width="2"></g>
   <path id="beam2" fill="url(#beamG)"/>
   <ellipse cx="196" cy="636" rx="150" ry="50" fill="#d8c8b0" stroke="var(--soft)" stroke-width="3"/>
   <g id="cat2"></g>
   <g id="pad" class="grab" tabindex="0" role="slider" aria-label="Cushion. Swipe back and forth to smooth it. Arrow keys also work." aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
     <rect class="focus" x="54" y="430" width="284" height="190" rx="20" fill="transparent"/>
     <path id="padShade" d="" fill="#000" opacity=".1" transform="translate(5 9)"/>
     <path id="padBody" d="" fill="var(--cushion)" stroke="var(--ink)" stroke-width="4" stroke-linejoin="round"/>
     <g id="seams" stroke="#cdbfa8" stroke-width="2" fill="none"></g>
     <g id="fibres" stroke="#b6a68d" stroke-width="2" stroke-linecap="round" fill="none"></g>
     <g id="trail" stroke="var(--accent)" fill="none" stroke-linecap="round"></g>
     <circle id="hint2" cx="196" cy="500" r="0" fill="none" stroke="var(--accent)" stroke-width="2" opacity="0"/>
   </g>
   <g id="side">
     <text x="58" y="716" font-size="10" fill="var(--mid)" letter-spacing=".8">LOFT</text>
     <line x1="58" x2="332" y1="766" y2="766" stroke="var(--soft)" stroke-width="2"/>
     <rect id="bandOk" x="56" y="0" width="278" height="0" rx="4" fill="none" stroke="var(--soft)" stroke-width="2"/>
     <path id="prof" d="" fill="none" stroke="var(--ink)" stroke-width="3"/>
   </g>
   <g id="flat" opacity="0"><circle cx="170" cy="810" r="19" fill="none" stroke="var(--ink)" stroke-width="3"/><path d="M163 803 l14 14 M177 803 l-14 14" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/></g>
   <g id="retry2" class="hit" tabindex="-1" role="button" aria-label="Fluff it up and try again" opacity="0" style="pointer-events:none">
     <circle class="focus" cx="222" cy="810" r="19" fill="var(--ink)"/>
     <path d="M229 810a7 7 0 1 1-2.3-5.2" fill="none" stroke="var(--wall)" stroke-width="2.2" stroke-linecap="round"/>
     <path d="M227.5 800.5v4.5h-4.5" fill="none" stroke="var(--wall)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
   </g>
 </g>

 <!-- ===== scene 3: hush the room (press + hold) ===== -->
 <g id="s3" class="scene" transform="translate(390 0)">
   <g id="hushHit" class="hit" tabindex="0" role="button" aria-label="The room. Press and hold anywhere to quieten it.">
     <rect class="focus" x="0" y="0" width="390" height="844" fill="var(--wall)"/>
     <rect x="0" y="560" width="390" height="284" fill="var(--floor)"/>
     <g id="boards3" stroke="#b9a489" stroke-width="2"></g>
     <g id="clock"><circle cx="86" cy="212" r="32" fill="#f6f1e6" stroke="var(--ink)" stroke-width="4"/><path id="hand" d="M86 212 L86 192" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/><circle cx="86" cy="212" r="3" fill="var(--ink)"/></g>
     <g id="win3"><rect x="236" y="170" width="118" height="100" rx="6" fill="#f6f1e6" stroke="var(--ink)" stroke-width="4"/><line x1="295" y1="170" x2="295" y2="270" stroke="var(--ink)" stroke-width="3"/></g>
     <g id="pipe"><rect x="34" y="372" width="28" height="112" rx="12" fill="#f6f1e6" stroke="var(--ink)" stroke-width="4"/><line x1="41" y1="396" x2="55" y2="396" stroke="var(--soft)" stroke-width="3"/><line x1="41" y1="428" x2="55" y2="428" stroke="var(--soft)" stroke-width="3"/><line x1="41" y1="460" x2="55" y2="460" stroke="var(--soft)" stroke-width="3"/></g>
     <g id="waves" fill="none" stroke="var(--ink)"></g>
     <ellipse cx="196" cy="636" rx="150" ry="50" fill="#d8c8b0" stroke="var(--soft)" stroke-width="3"/>
     <path id="pad3" d="M72 616 q-6 -40 36 -46 q90 -12 160 2 q42 6 36 44 q-6 26 -116 26 q-110 0 -116 -26 Z" fill="var(--cushion)" stroke="var(--ink)" stroke-width="4" stroke-linejoin="round"/>
     <g id="cat3"></g>
     <g id="zzz" fill="var(--ink)" opacity="0"></g>
     <path id="breath" d="" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>
     <line id="calm" x1="58" x2="332" y1="770" y2="770" stroke="var(--accent)" stroke-width="12" stroke-linecap="round" opacity=".18"/>
     <rect id="dim" x="0" y="0" width="390" height="844" fill="var(--night)" opacity="0" pointer-events="none"/>
     <circle id="press" cx="195" cy="470" r="0" fill="none" stroke="var(--sun)" stroke-width="2" opacity="0" pointer-events="none"/>
     <circle id="hint3" cx="195" cy="470" r="0" fill="none" stroke="var(--accent)" stroke-width="2" opacity="0" pointer-events="none"/>
   </g>
 </g>

 <!-- ===== end ===== -->
 <g id="s4" class="scene" transform="translate(390 0)">
   <rect x="0" y="0" width="390" height="844" fill="var(--night)"/>
   <rect x="0" y="560" width="390" height="284" fill="#2a2733"/>
   <ellipse cx="196" cy="636" rx="150" ry="50" fill="#38333f"/>
   <path d="M72 616 q-6 -40 36 -46 q90 -12 160 2 q42 6 36 44 q-6 26 -116 26 q-110 0 -116 -26 Z" fill="#4a4451"/>
   <g id="cat4"></g>
   <g id="zzz4" fill="#e8e1d6"></g>
   <text class="title" x="196" y="300" font-size="32" text-anchor="middle" fill="#e8e1d6" id="eTitle">Asleep</text>
   <g id="eRows" font-size="13" fill="#e8e1d6"></g>
   <g id="again" class="hit" tabindex="0" role="button" aria-label="Start a new afternoon">
     <rect class="focus" x="105" y="748" width="180" height="50" rx="25" fill="#e8e1d6"/>
     <text x="195" y="779" font-size="14" text-anchor="middle" fill="var(--night)">Another afternoon</text>
   </g>
 </g>
 </g>
</svg>
</div>
<aside class="panel" id="panel" hidden aria-label="Tool panel"></aside>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/panel.js"></script>
</body>
</html>
