<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cat Naps</title>
<meta name="description" content="A field with a cat asleep in her basket. Lift her out, feed her, smooth her down, take the day away, and put her back to bed. Nothing is written down — the light tells you what to touch next.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500&display=swap" rel="stylesheet">
<script>
  /* Load the stylesheet with a fresh token every visit. A fixed ?v= written into this file
     is no use once a browser has cached the file itself, which is exactly what GitHub Pages
     lets it do: the page would then pin the CSS to whichever version it was cached with. */
  document.write('<link rel="stylesheet" href="css/style.css?v=' + Date.now() + '">');
</script>
<noscript><link rel="stylesheet" href="css/style.css"></noscript>
</head>
<body>
<svg id="stage" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice"
     aria-label="A field with a cat asleep in a basket. Lift her out, put the fish in her dish, smooth her fur, set the sun, and carry her back to bed.">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop id="skyTop" offset="0%"/><stop id="skyMid" offset="58%"/><stop id="skyLow" offset="100%"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop id="groundTop" offset="0%"/><stop id="groundBot" offset="100%"/>
    </linearGradient>

    <!-- the one suggestion in the piece: a patch of ground that is brighter than the rest -->
    <radialGradient id="glowPool" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="var(--glow)" stop-opacity="1"/>
      <stop offset="40%"  stop-color="var(--glow)" stop-opacity=".62"/>
      <stop offset="72%"  stop-color="var(--glow)" stop-opacity=".22"/>
      <stop offset="100%" stop-color="var(--glow)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FFF3C4" stop-opacity=".95"/>
      <stop offset="38%"  stop-color="#FFE898" stop-opacity=".34"/>
      <stop offset="100%" stop-color="#FFE898" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#EAF2FF" stop-opacity=".80"/>
      <stop offset="40%"  stop-color="#C8D8F6" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#C8D8F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="46%" r="78%">
      <stop offset="56%"  stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity=".30"/>
    </radialGradient>

    <filter id="soft"   x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="cloudy" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="13"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect id="sky" width="100%" height="100%" fill="url(#skyGrad)"/>
  <g id="stars"></g>
  <g id="celestial"></g>
  <g id="clouds"></g>
  <g id="hills"></g>
  <g id="treesFar"></g>
  <g id="treesNear"></g>

  <rect id="ground" x="0" y="408" width="100%" height="420" fill="url(#groundGrad)"/>
  <g id="decor"></g>

  <g id="hintG"  pointer-events="none"></g>
  <g id="ping"   pointer-events="none"></g>
  <g id="bedBack"></g>
  <g id="dish"></g>
  <g id="fish"></g>
  <g id="catShadow"></g>
  <g id="catArt"></g>
  <g id="zzz"></g>
  <g id="bedFront" pointer-events="none"></g>
  <g id="sparkle" pointer-events="none"></g>

  <rect width="100%" height="100%" fill="url(#vignette)" pointer-events="none"/>
  <rect id="grainLayer" width="100%" height="100%" filter="url(#grain)" opacity=".05"
        style="mix-blend-mode:overlay" pointer-events="none"/>

  <g id="dots" pointer-events="none"></g>

  <g id="titleG" pointer-events="none">
    <text id="t1" x="32" y="152" class="display" font-size="46">Cat Naps</text>
    <text id="t2" x="34" y="180" class="hint" font-size="15">follow the light</text>
  </g>
</svg>
<div id="panel" class="panel" hidden aria-label="Field tuning"></div>
<script>
  /* Same reason: fetch the current code on every visit rather than whatever the browser kept.
     async = false keeps config -> app -> panel running in that order. */
  (function () {
    var v = Date.now();
    ['js/config.js', 'js/app.js', 'js/panel.js'].forEach(function (src) {
      var el = document.createElement('script');
      el.src = src + '?v=' + v;
      el.async = false;
      document.head.appendChild(el);
    });
  })();
</script>
</body>
</html>
