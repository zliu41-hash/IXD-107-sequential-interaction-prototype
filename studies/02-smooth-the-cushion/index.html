<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smooth the Cushion</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one 390×844 phone screen, centred and scaled to fit. Everything is one SVG.
   Grayscale on purpose: this is a behaviour study, not a visual design. */
:root{
  --room:#cfcfcf; --screen:#f2f2f2; --ink:#1d1d1d; --mid:#808080; --soft:#bcbcbc; --faint:#e4e4e4;
  --ui:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
html,body{height:100%}
body{margin:0;background:var(--room);color:var(--ink);display:flex;align-items:center;justify-content:center;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));box-sizing:border-box;overflow:hidden}
.phone{height:min(844px, calc(100% - 24px));aspect-ratio:390/844;max-width:100%;background:var(--screen);border-radius:36px;overflow:hidden;box-shadow:0 0 0 1px var(--soft)}
svg{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;font-family:var(--ui)}
.grab{cursor:grab;outline:none}.grab.on{cursor:grabbing}
.grab:focus-visible .focus{stroke:var(--ink);stroke-dasharray:4 4;stroke-width:2}
@media (max-width:430px){.phone{border-radius:0;box-shadow:none;height:100%}body{padding-left:0;padding-right:0}}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">

</head>
<body>
<div class="phone">
<svg id="s" viewBox="0 0 390 844" aria-label="Interaction study: swipe back and forth across the cushion to smooth it">
 <rect x="0" y="0" width="390" height="844" fill="#d9d9d9"/>
 <text x="28" y="60" font-size="11" fill="var(--mid)" letter-spacing="1.6">CAT NAPS · STUDY 2</text>
 <text x="28" y="84" font-size="17" fill="var(--ink)" font-weight="500">Smooth the cushion</text>

 <!-- the sunlit rug from step 1, so the room reads as the same place -->
 <ellipse cx="196" cy="590" rx="150" ry="52" fill="#e9e9e9" stroke="var(--soft)" stroke-width="3"/>

 <!-- cat: watches, then steps on and kneads -->
 <g id="cat"></g>

 <!-- the cushion is the whole target: no button, the lumps are the invitation -->
 <g id="pad" class="grab" tabindex="0" role="slider" aria-label="Cushion. Swipe back and forth to smooth it. Arrow keys also work." aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
   <rect class="focus" x="54" y="440" width="284" height="170" rx="20" fill="transparent"/>
   <path id="shade" d="" fill="#000" opacity=".12"/>
   <path id="body" d="" fill="#ededed" stroke="var(--ink)" stroke-width="4" stroke-linejoin="round"/>
   <g id="seams" stroke="var(--mid)" stroke-width="2" fill="none"></g>
   <g id="fibres" stroke="var(--mid)" stroke-width="2" stroke-linecap="round" fill="none"></g>
   <g id="trail" stroke="var(--ink)" fill="none" stroke-linecap="round"></g>
 </g>

 <!-- loft: a side profile of the cushion, drawn as the thing itself rather than a gauge -->
 <g id="side">
   <text x="58" y="712" font-size="10" fill="var(--mid)" letter-spacing=".8">LOFT</text>
   <line x1="58" x2="332" y1="762" y2="762" stroke="var(--soft)" stroke-width="2"/>
   <rect id="bandOk" x="0" y="0" width="0" height="0" rx="4" fill="none" stroke="var(--ink)" stroke-width="2"/>
   <path id="prof" d="" fill="none" stroke="var(--ink)" stroke-width="3"/>
 </g>

 <g id="done" opacity="0"><circle cx="196" cy="800" r="19" fill="var(--ink)"/><path d="M188 800 l6 6 l11 -12" fill="none" stroke="var(--screen)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
 <g id="flat" opacity="0"><circle cx="170" cy="800" r="19" fill="none" stroke="var(--ink)" stroke-width="3"/><path d="M163 793 l14 14 M177 793 l-14 14" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/></g>
 <g id="retry" class="grab" tabindex="-1" role="button" aria-label="Fluff it up and try again" opacity="0" style="pointer-events:none;cursor:pointer">
   <circle class="focus" cx="222" cy="800" r="19" fill="var(--ink)"/>
   <path d="M229 800a7 7 0 1 1-2.3-5.2" fill="none" stroke="var(--screen)" stroke-width="2.2" stroke-linecap="round"/>
   <path d="M227.5 790.5v4.5h-4.5" fill="none" stroke="var(--screen)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
 </g>
</svg>
</div>
<script>
const $=id=>document.getElementById(id), svg=$('s');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const toSvg=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());};
const N=9, L=70, R=322, CY=560, SPAN=R-L;        // the cushion's top edge, sampled across N points
const px=i=>L+SPAN*i/(N-1);
const GOOD=[0.62,0.88];                           // smoothness that the cat will accept
let S;
function reset(){
  S={h:[], t:0, drag:null, strokes:0, dir:0, lastX:0, done:false, flat:false, touched:false, trail:[], knead:0, cat:0, settle:0};
  for(let i=0;i<N;i++){ const u=i/(N-1); S.h.push(64 + Math.sin(u*9.1)*22 + Math.sin(u*21+1.7)*13 + (Math.random()*8-4)); }
  retry(false);
}
function retry(on){ const r=$('retry'); r.setAttribute('opacity',on?1:0); r.style.pointerEvents=on?'auto':'none'; r.setAttribute('tabindex',on?0:-1); }
reset();

// smoothness 0..1: 1 means a flat top edge at a good height
function metrics(){
  const mean=S.h.reduce((a,b)=>a+b,0)/N;
  let rough=0; for(let i=1;i<N;i++) rough+=Math.abs(S.h[i]-S.h[i-1]);
  return {mean, smooth: clamp(1-rough/90, 0, 1)};
}
function press(x, strength){
  for(let i=0;i<N;i++){
    const d=Math.abs(px(i)-x);
    const w=Math.exp(-(d*d)/(2*58*58));
    const m=metrics().mean;
    S.h[i] += (m-S.h[i])*w*strength*0.55;   // pull each point toward the average: that is what smoothing is
    S.h[i] -= w*strength*1.05;               // and every pass presses a little air out
    S.h[i] = clamp(S.h[i], 8, 110);
  }
}
const pad=$('pad');
pad.addEventListener('pointerdown',e=>{ if(S.done) return; const p=toSvg(e); S.drag={x:p.x}; S.lastX=p.x; S.touched=true; pad.setPointerCapture(e.pointerId); pad.classList.add('on'); });
pad.addEventListener('pointermove',e=>{
  if(!S.drag||S.done) return; const p=toSvg(e);
  const dx=p.x-S.lastX; if(Math.abs(dx)<1) return;
  const d=Math.sign(dx);
  if(d!==S.dir){ S.dir=d; S.strokes++; }
  press(p.x, Math.min(1, Math.abs(dx)/26));
  S.trail.push({x:p.x, y:p.y, a:1});
  S.lastX=p.x;
});
const up=()=>{ if(!S.drag) return; S.drag=null; pad.classList.remove('on'); };
pad.addEventListener('pointerup',up); pad.addEventListener('pointercancel',up); pad.addEventListener('lostpointercapture',up);
pad.addEventListener('keydown',e=>{
  const d=e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0; if(!d||S.done) return; e.preventDefault(); S.touched=true;
  S.dir=d; S.strokes++; for(let k=0;k<N;k++) press(px(k), .5);
});
$('retry').addEventListener('click',()=>reset());
$('retry').addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();reset();} });

const topY=i=>CY-S.h[i];
function cushionPath(){
  let d=`M${L} ${CY}`;
  d+=` C${L-14} ${CY-18} ${L-10} ${topY(0)+10} ${px(0)} ${topY(0)}`;
  for(let i=1;i<N;i++){ const x0=px(i-1), x1=px(i), xm=(x0+x1)/2; d+=` C${xm} ${topY(i-1)} ${xm} ${topY(i)} ${x1} ${topY(i)}`; }
  d+=` C${R+10} ${topY(N-1)+10} ${R+14} ${CY-18} ${R} ${CY}`;
  d+=` C${R-6} ${CY+22} ${L+6} ${CY+22} ${L} ${CY} Z`;
  return d;
}
function catSvg(x,y,mode,t){
  const blink=(Math.sin(t*1.2)>.95)?1:0;
  if(mode==='curl'){
    const e=(Math.sin(t*.8)>.1)?1:0;
    return `<ellipse cx="${x}" cy="${y+14}" rx="38" ry="6" fill="#000" opacity=".12"/>
    <path d="M${x-40} ${y+8} q-4 -28 23 -32 q29 -5 42 13 q13 19 -6 25 q-29 8 -59 -6 Z" fill="var(--ink)"/>
    <circle cx="${x-13}" cy="${y-9}" r="16" fill="var(--ink)"/>
    <path d="M${x-26} ${y-18} l-3 -13 l13 5 Z" fill="var(--ink)"/><path d="M${x-6} ${y-21} l6 -12 l7 9 Z" fill="var(--ink)"/>
    ${e?`<path d="M${x-18} ${y-10} q4 4 9 0" fill="none" stroke="var(--screen)" stroke-width="2.4" stroke-linecap="round"/>`:`<circle cx="${x-14}" cy="${y-11}" r="2.1" fill="var(--screen)"/>`}`;
  }
  const paw = mode==='knead' ? Math.sin(t*7)*6 : 0;
  return `<ellipse cx="${x+2}" cy="${y+20}" rx="28" ry="6" fill="#000" opacity=".12"/>
  <path d="M${x+22} ${y+12} q25 6 19 -14" fill="none" stroke="var(--ink)" stroke-width="7" stroke-linecap="round"/>
  <path d="M${x-20} ${y+16} q-6 -32 13 -38 q25 -8 32 15 q6 21 -6 23 Z" fill="var(--ink)"/>
  <path d="M${x-14} ${y+6} l0 ${(10+paw).toFixed(1)} M${x+1} ${y+6} l0 ${(10-paw).toFixed(1)}" stroke="var(--ink)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="${x-4}" cy="${y-21}" r="18" fill="var(--ink)"/>
  <path d="M${x-19} ${y-31} l-2 -15 l14 6 Z" fill="var(--ink)"/><path d="M${x+6} ${y-34} l6 -14 l8 10 Z" fill="var(--ink)"/>
  ${blink?`<path d="M${x-14} ${y-25} h7 M${x-1} ${y-25} h7" stroke="var(--screen)" stroke-width="2.4" stroke-linecap="round"/>`
         :`<circle cx="${x-10}" cy="${y-25}" r="2.3" fill="var(--screen)"/><circle cx="${x+3}" cy="${y-25}" r="2.3" fill="var(--screen)"/>`}`;
}

let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now; S.t+=dt;
  const {mean, smooth}=metrics();
  const loft=clamp((mean-18)/70,0,1);
  const ok = smooth>=GOOD[0] && smooth<=1 && loft>0.24;
  S.flat = loft<=0.24;
  pad.setAttribute('aria-valuenow', Math.round(smooth*100));

  $('body').setAttribute('d', cushionPath());
  $('shade').setAttribute('d', cushionPath());
  $('shade').setAttribute('transform','translate(5 9)');

  // seams follow the top edge, so the lumps are readable as shape, not shading
  let sm='';
  for(const off of [14,30]){ let d=`M${L+12} ${CY-off*.3}`; for(let i=0;i<N;i++) d+=` L${px(i).toFixed(0)} ${(topY(i)+off).toFixed(1)}`; d+=` L${R-12} ${CY-off*.3}`; sm+=`<path d="${d}" opacity="${(0.5-off/120).toFixed(2)}"/>`; }
  $('seams').innerHTML=sm;

  // loose fibres stand up where the cushion is still rough — the invitation to keep going
  let fb='';
  for(let i=0;i<N;i++){
    const local=Math.abs(S.h[i]-mean);
    if(local>5){ const n=Math.min(3,Math.round(local/6)); for(let k=0;k<n;k++){ const x=px(i)+(k-1)*7, y=topY(i); const w=reduce?0:Math.sin(S.t*2+i+k)*3; fb+=`<path d="M${x.toFixed(1)} ${y.toFixed(1)} q${w.toFixed(1)} -6 ${(w*1.6).toFixed(1)} -11" opacity="${Math.min(.8,local/22).toFixed(2)}"/>`; } }
  }
  $('fibres').innerHTML=fb;

  for(const p of S.trail) p.a-=dt*2.4;
  S.trail=S.trail.filter(p=>p.a>0);
  $('trail').innerHTML=S.trail.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${(4+(1-p.a)*8).toFixed(1)}" opacity="${(p.a*.18).toFixed(2)}" stroke-width="2"/>`).join('');

  // side profile: a small drawing of the same cushion seen edge-on
  let pf=`M58 762`; for(let i=0;i<N;i++) pf+=` L${(58+274*i/(N-1)).toFixed(1)} ${(762-S.h[i]*.52).toFixed(1)}`; pf+=` L332 762`;
  $('prof').setAttribute('d', pf);
  $('bandOk').setAttribute('x',56); $('bandOk').setAttribute('width',278);
  $('bandOk').setAttribute('y',(762-78*.52-7).toFixed(1)); $('bandOk').setAttribute('height',(40*.52+14).toFixed(1));
  $('bandOk').setAttribute('stroke', ok?'var(--ink)':'var(--soft)');

  // the cat: watches from the right, steps on when it is smooth, kneads, then curls
  if(!S.done){
    if(ok && !S.flat && !S.drag){ S.settle+=dt; S.cat=Math.min(1,S.cat+dt*.9); } else { S.settle=0; S.cat=Math.max(0,S.cat-dt*1.4); }
    if(S.settle>1.2 && S.cat>=1) S.done=true;
  }
  const cx=330-S.cat*132, cy=600-S.cat*(26+mean*.2);
  if(S.done) $('cat').innerHTML=catSvg(196, CY-mean*.45, 'curl', S.t);
  else $('cat').innerHTML=catSvg(cx, cy, S.cat>=1?'knead':'sit', S.t);

  if(S.flat && S.touched && !S.done) retry(true);
  $('done').setAttribute('opacity',S.done?1:0);
  $('flat').setAttribute('opacity',(!S.done&&S.flat&&S.touched)?1:0);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.CAT=()=>({...metrics(), h:S.h, strokes:S.strokes, done:S.done, flat:S.flat, cat:S.cat});
</script>

</body>
</html>
