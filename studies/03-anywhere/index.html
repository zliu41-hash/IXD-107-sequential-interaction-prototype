<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anywhere</title>
<style>
  :root{ --bg:#e6e6e6; --paper:#f7f7f5; --ink:#262626; --mid:#8e8e8e; --faint:#cfcfcf; --stone:#e2e1de; }
  *{box-sizing:border-box} html,body{height:100%;margin:0}
  body{background:var(--bg);display:flex;align-items:center;justify-content:center;
       font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;color:var(--ink);overflow:hidden}
  .phone{height:min(844px,calc(100% - 20px));aspect-ratio:390/844;max-width:100%;
         background:var(--paper);border-radius:34px;overflow:hidden;
         box-shadow:0 0 0 1px var(--faint),0 24px 50px -28px rgba(0,0,0,.4)}
  svg{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
  #cat{cursor:grab} #cat.held{cursor:grabbing}
  @media(max-width:430px){ .phone{height:100%;border-radius:0;box-shadow:none} }
</style>
</head>
<body>
<div class="phone">
<svg id="stage" viewBox="0 0 390 844" aria-label="Drag the cat anywhere on the street; let go and it sleeps there">
  <rect width="390" height="844" fill="var(--paper)"/>
  <text x="34" y="74" font-size="13" letter-spacing="2.4" fill="var(--mid)">STUDY 3</text>
  <text x="34" y="112" font-size="30" font-family="Georgia,serif" fill="var(--ink)">Anywhere</text>
  <text x="34" y="142" font-size="13" fill="var(--mid)">heavy — drag the cat, then let go</text>

  <!-- a small stretch of street -->
  <rect x="0" y="470" width="390" height="300" fill="var(--stone)"/>
  <line x1="0" y1="470" x2="390" y2="470" stroke="var(--faint)" stroke-width="2"/>
  <line x1="0" y1="770" x2="390" y2="770" stroke="var(--faint)" stroke-width="2"/>
  <g stroke="var(--faint)" stroke-width="1.5">
    <line x1="0" y1="570" x2="390" y2="570"/><line x1="0" y1="670" x2="390" y2="670"/>
    <line x1="96" y1="470" x2="96" y2="770"/><line x1="196" y1="470" x2="196" y2="770"/><line x1="296" y1="470" x2="296" y2="770"/>
  </g>
  <!-- props -->
  <g fill="none" stroke="var(--ink)" stroke-width="3" stroke-linecap="round">
    <path d="M330 470 v-150"/><path d="M330 322 h-26"/>
    <circle cx="300" cy="328" r="11" fill="var(--paper)"/>
    <rect x="48" y="396" width="52" height="74" rx="4" fill="var(--paper)"/>
    <path d="M56 396 v-16 h36 v16"/>
  </g>
  <g id="cat"></g>
  <g id="zzz" fill="var(--mid)" font-size="16"></g>
  <text x="34" y="812" id="state" font-size="13" fill="var(--mid)">asleep</text>
</svg>
</div>
<script>
(() => {
const svg=document.getElementById('stage'), $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pt=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());};

// phases: 0 asleep · 1 held · 2 landing stretch · 3 curling back down
const S={ t:0, x:170, y:600, held:false, wake:0, stretch:0, grabDX:0, grabDY:0 };

function body(x,y,wake,stretch){
  // wake 0..1 lifts the head and opens the eye; stretch is the little arch after landing
  const b=Math.sin(S.t*(wake>.5?2.6:1.1))*2.6*(1-wake*.4);
  const arch = Math.sin(stretch*Math.PI)*10;
  const ears = wake*4;
  const legs = S.held
    ? `<path d="M${x-26} ${y+16} l${(-6+Math.sin(S.t*6)*4).toFixed(1)} 20 M${x-6} ${y+18} l${(2+Math.sin(S.t*6+2)*4).toFixed(1)} 22
         M${x+12} ${y+16} l${(6+Math.sin(S.t*6+4)*4).toFixed(1)} 20" stroke="var(--ink)" stroke-width="5" stroke-linecap="round" fill="none"/>` : '';
  const eye = wake>.35
    ? `<circle cx="${x-19}" cy="${y-11}" r="2.4" fill="var(--paper)"/>`
    : `<path d="M${x-22} ${y-10} q5 4 10 0" fill="none" stroke="var(--paper)" stroke-width="2.5" stroke-linecap="round"/>`;
  const tailSwing = S.held ? Math.sin(S.t*3.4)*18 : 0;
  return `<ellipse cx="${x}" cy="${y+20+(S.held?26:0)}" rx="${(48-(S.held?14:0)).toFixed(0)}" ry="8" fill="#000" opacity="${S.held?'.08':'.13'}"/>
  <g transform="translate(0 ${(b-arch).toFixed(2)})">
  <path d="M${x+40} ${y+10} q${(24+tailSwing).toFixed(1)} 8 ${(16+tailSwing*.6).toFixed(1)} ${(-18+arch).toFixed(1)}" fill="none" stroke="var(--ink)" stroke-width="7" stroke-linecap="round"/>
  ${legs}
  <path d="M${x-48} ${y+14} q-6 ${(-32-arch).toFixed(1)} 26 -38 q34 -6 48 14 q15 21 -6 28 q-34 10 -68 -4 Z" fill="var(--ink)"/>
  <circle cx="${x-17}" cy="${(y-9-wake*6).toFixed(1)}" r="18" fill="var(--ink)"/>
  <path d="M${x-32} ${(y-20-wake*6).toFixed(1)} l${(-3+ears).toFixed(1)} ${(-15+ears*2).toFixed(1)} l15 6 Z" fill="var(--ink)"/>
  <path d="M${x-7} ${(y-23-wake*6).toFixed(1)} l${(6-ears).toFixed(1)} ${(-14+ears*2).toFixed(1)} l9 10 Z" fill="var(--ink)"/>
  <g transform="translate(0 ${(-wake*6).toFixed(1)})">${eye}
  <path d="M${x-17} ${y-3} l-3 3 l3 2 l3 -2 Z" fill="var(--paper)"/></g></g>`;
}

function draw(){
  const tf=`translate(${S.x.toFixed(1)} ${S.y.toFixed(1)}) scale(1.25) translate(${(-S.x).toFixed(1)} ${(-S.y).toFixed(1)})`;
  $('cat').setAttribute('transform',tf); $('zzz').setAttribute('transform',tf);
  $('cat').innerHTML = body(S.x, S.y, S.wake, S.stretch);
  $('cat').classList.toggle('held', S.held);
  if(S.wake<.1 && S.stretch<.05){
    let z=''; for(let i=0;i<3;i++){ const p=((S.t*.35+i*.33)%1);
      z+=`<text x="${(S.x+34+p*26).toFixed(0)}" y="${(S.y-34-p*66).toFixed(0)}" font-size="${13+i*5}" opacity="${((1-p)*.85*(1-S.wake*10)).toFixed(2)}">z</text>`; }
    $('zzz').innerHTML=z;
  } else $('zzz').innerHTML='';
  $('state').textContent = S.held ? 'carried — let go anywhere'
                         : S.stretch>.05 ? 'a stretch, then down'
                         : S.wake>.1 ? 'settling' : 'asleep where you left it';
}

const onCat = p => Math.hypot(p.x-S.x,(p.y-S.y)*1.4) < 92;
svg.addEventListener('pointerdown', e=>{ const p=pt(e); if(!onCat(p)) return;
  S.held=true; S.grabDX=S.x-p.x; S.grabDY=S.y-p.y; S.stretch=0; svg.setPointerCapture(e.pointerId); });
svg.addEventListener('pointermove', e=>{ if(!S.held) return; const p=pt(e);
  S.x=clamp(p.x+S.grabDX,58,332); S.y=clamp(p.y+S.grabDY,516,742); });
const drop=()=>{ if(S.held){ S.held=false; S.stretch=1; } };
addEventListener('pointerup',drop); addEventListener('pointercancel',drop);

let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now; S.t+=dt;
  S.wake = S.held ? Math.min(1,S.wake+dt*5) : Math.max(0,S.wake-dt*1.1);
  if(!S.held && S.stretch>0) S.stretch=Math.max(0,S.stretch-dt*1.3);   // one stretch, then down
  draw(); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.CAT=()=>S;
})();
</script>
</body>
</html>
