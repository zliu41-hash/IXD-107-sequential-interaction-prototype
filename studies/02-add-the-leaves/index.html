<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Add the Leaves</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one 390×844 phone frame, centred and scaled to fit; everything inside is one SVG. Single grayscale look on purpose. */
:root{
  --room:#cfcfcf; --screen:#f1f1f1; --ink:#1b1b1b; --mid:#7d7d7d; --soft:#bdbdbd; --faint:#e2e2e2;
  --ui:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
html,body{height:100%}
body{margin:0;background:var(--room);color:var(--ink);display:flex;align-items:center;justify-content:center;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));box-sizing:border-box;overflow:hidden}
.phone{height:min(844px, calc(100% - 24px));aspect-ratio:390/844;max-width:100%;background:var(--screen);border-radius:36px;overflow:hidden;box-shadow:0 0 0 1px var(--soft)}
svg{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;font-family:var(--ui)}
.hit{cursor:pointer;outline:none}
.hit:focus-visible .focus{stroke:var(--ink);stroke-dasharray:4 4}
@media (max-width:430px){ .phone{border-radius:0;box-shadow:none;height:100%} body{padding-left:0;padding-right:0} }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
</head>
<body>

<div class="phone">
<svg id="s" viewBox="0 0 390 844" aria-label="Interaction study: tap the tea jar to add pinches of leaves to the gaiwan">
  <text x="28" y="66" font-size="12" fill="var(--mid)" letter-spacing="1.2">STUDY 2 / 3</text>
  <text x="28" y="88" font-size="17" fill="var(--ink)" font-weight="500">Add the leaves</text>
  <g id="reset" class="hit" tabindex="0" role="button" aria-label="Reset">
    <circle class="focus" cx="352" cy="74" r="20" fill="var(--faint)" stroke="none"/>
    <path d="M361 74a9 9 0 1 1-3-6.7" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/>
    <path d="M358.5 62.5v5.5h-5.5" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- gaiwan -->
  <g id="bowlG">
    <ellipse cx="195" cy="600" rx="120" ry="16" fill="var(--faint)" stroke="var(--ink)" stroke-width="4"/>
    <path d="M105 470 Q110 590 195 590 Q280 590 285 470 Z" fill="var(--screen)" stroke="var(--ink)" stroke-width="5" stroke-linejoin="round"/>
    <ellipse id="mouth" cx="195" cy="470" rx="90" ry="14" fill="var(--faint)" stroke="var(--ink)" stroke-width="4"/>
    <ellipse id="target" cx="195" cy="470" rx="104" ry="24" fill="none" stroke="var(--soft)" stroke-width="2" stroke-dasharray="5 6"/>
    <g id="pile"></g>
    <g id="lid" opacity="0">
      <ellipse cx="195" cy="468" rx="96" ry="18" fill="var(--screen)" stroke="var(--ink)" stroke-width="4"/>
      <path d="M115 466 Q195 410 275 466" fill="var(--screen)" stroke="var(--ink)" stroke-width="4"/>
      <rect x="182" y="424" width="26" height="14" rx="6" fill="var(--ink)"/>
    </g>
  </g>
  <g id="spill"></g>
  <g id="air"></g>

  <!-- tea jar: the tap target -->
  <g id="jarHit" class="hit" tabindex="0" role="button" aria-label="Tea jar. Tap to add one pinch of leaves.">
    <rect class="focus" x="196" y="150" width="140" height="190" rx="20" fill="transparent" stroke="none"/>
    <g id="jar">
      <rect x="226" y="196" width="88" height="124" rx="16" fill="var(--soft)" stroke="var(--ink)" stroke-width="4"/>
      <rect x="220" y="178" width="100" height="24" rx="8" fill="var(--ink)"/>
      <g fill="var(--ink)" opacity=".55">
        <ellipse cx="252" cy="280" rx="6" ry="3" transform="rotate(20 252 280)"/>
        <ellipse cx="272" cy="296" rx="6" ry="3" transform="rotate(-30 272 296)"/>
        <ellipse cx="290" cy="276" rx="6" ry="3" transform="rotate(50 290 276)"/>
        <ellipse cx="262" cy="304" rx="6" ry="3"/>
        <ellipse cx="288" cy="302" rx="6" ry="3" transform="rotate(-10 288 302)"/>
      </g>
    </g>
    <circle id="tapRing" cx="270" cy="258" r="0" fill="none" stroke="var(--ink)" stroke-width="2" opacity="0"/>
  </g>

  <!-- dose meter: one dot per pinch (≈1 g), target 5–7 g for a 100 ml gaiwan -->
  <g id="meter"></g>
  <rect id="bracket" x="0" y="680" width="0" height="36" rx="18" fill="none" stroke="var(--ink)" stroke-width="2"/>
  <text id="bracketLbl" x="0" y="740" font-size="11" fill="var(--mid)" text-anchor="middle">5–7 g</text>
  <text x="195" y="640" font-size="11" fill="var(--mid)" text-anchor="middle">100 ml</text>

  <g id="done" opacity="0">
    <circle cx="195" cy="790" r="22" fill="var(--ink)"/>
    <path d="M185 790 l7 7 l13 -14" fill="none" stroke="var(--screen)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g id="over" opacity="0">
    <circle cx="195" cy="790" r="22" fill="none" stroke="var(--ink)" stroke-width="3"/>
    <path d="M187 782 l16 16 M203 782 l-16 16" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
</div>

<script>
const $ = id => document.getElementById(id);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const N = 10, LO = 5, HI = 7, DX = 26, X0 = 195 - (N - 1) * DX / 2, MY = 698;
const dotX = i => X0 + i * DX;
$('bracket').setAttribute('x', dotX(LO - 1) - 16);
$('bracket').setAttribute('width', dotX(HI - 1) - dotX(LO - 1) + 32);
$('bracketLbl').setAttribute('x', (dotX(LO - 1) + dotX(HI - 1)) / 2);

let S;
function reset() {
  S = { count: 0, tilt: 0, tiltT: 1, since: 0, done: false, over: false, t: 0, air: [], landed: [], spilled: [], pop: -1, popT: 0, ring: 1, lidY: -80, shake: 0, no: 0 };
  $('pile').innerHTML = ''; $('spill').innerHTML = '';
  drawMeter();
}
function drawMeter() {
  let m = '';
  for (let i = 0; i < N; i++) {
    const filled = i < S.count;
    const extra = i >= HI;
    const r = 7 + (i === S.pop ? 5 * (1 - S.popT) : 0);
    m += filled
      ? `<circle cx="${dotX(i)}" cy="${MY}" r="${r.toFixed(1)}" fill="${extra ? 'var(--screen)' : 'var(--ink)'}" stroke="var(--ink)" stroke-width="${extra ? 3 : 0}"/>` + (extra ? `<path d="M${dotX(i) - 4} ${MY - 4} l8 8 M${dotX(i) + 4} ${MY - 4} l-8 8" stroke="var(--ink)" stroke-width="2"/>` : '')
      : `<circle cx="${dotX(i)}" cy="${MY}" r="6" fill="none" stroke="var(--soft)" stroke-width="2"/>`;
  }
  $('meter').innerHTML = m;
}
reset();

function pinch() {
  if (S.done) { S.no = 1; return; }
  if (S.count >= N) { S.no = 1; return; }
  S.count++; S.since = 0; S.tiltT = 0; S.ring = 0; S.pop = S.count - 1; S.popT = 0;
  if (S.count > HI) { S.over = true; S.shake = 1; }
  for (let i = 0; i < 7; i++) {
    S.air.push({ x: 214 + Math.random() * 22, y: 250 + Math.random() * 10, vx: -10 - Math.random() * 55, vy: -60 + Math.random() * 40,
      a: Math.random() * 180, va: (Math.random() - .5) * 600, g: Math.random() < .5 ? 'var(--ink)' : 'var(--mid)', over: S.over });
  }
  drawMeter();
}
const jar = $('jarHit');
jar.addEventListener('pointerdown', e => { e.preventDefault(); pinch(); });
jar.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); pinch(); } });
jar.addEventListener('contextmenu', e => e.preventDefault());
$('reset').addEventListener('click', reset);
$('reset').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); reset(); } });

// pile surface inside the bowl rises with each pinch (only up to the rim)
const surf = x => { const h = Math.min(S.count, HI) * 7; const u = (x - 195) / 80; return 584 - Math.max(0, h * (1 - u * u)) - 4; };
const leaf = (p) => `<ellipse cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" rx="6" ry="2.6" fill="${p.g}" transform="rotate(${p.a.toFixed(0)} ${p.x.toFixed(1)} ${p.y.toFixed(1)})"/>`;

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; S.t += dt; S.since += dt;

  // jar tilt: quick tip toward the bowl, then settle back
  S.tiltT = Math.min(1, S.tiltT + dt / 0.45);
  const tip = Math.sin(Math.PI * S.tiltT) * -32;
  const wob = (!S.done && S.count === 0 && !reduce) ? Math.sin(S.t * 6) * 4 * Math.max(0, Math.sin(S.t * 1.3)) ** 8 : 0;
  S.no = Math.max(0, S.no - dt * 2.5);
  const noShake = reduce ? 0 : Math.sin(S.t * 40) * 5 * S.no;
  $('jar').setAttribute('transform', `translate(${noShake.toFixed(1)},0) rotate(${(tip + wob).toFixed(1)} 230 320)`);

  // tap ring
  S.ring = Math.min(1, S.ring + dt * 2.5);
  $('tapRing').setAttribute('r', (20 + S.ring * 70).toFixed(1));
  $('tapRing').setAttribute('opacity', (1 - S.ring) * 0.8);

  // falling leaves
  for (const p of S.air) {
    p.vy += 1100 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.a += p.va * dt;
    const inside = p.x > 112 && p.x < 278;
    if (p.over && p.y > 455 && inside && !p.bounced) { p.bounced = true; p.vy = -260; p.vx = (p.x < 195 ? -1 : 1) * (90 + Math.random() * 80); }
    else if (!p.over && inside && p.y >= surf(p.x)) { p.y = surf(p.x); p.dead = 'pile'; }
    if (p.bounced && p.y >= 594) { p.y = 594 - Math.random() * 6; p.dead = 'spill'; }
    if (p.y > 900) p.dead = 'gone';
  }
  for (const p of S.air.filter(p => p.dead === 'pile')) S.landed.push(p);
  for (const p of S.air.filter(p => p.dead === 'spill')) S.spilled.push(p);
  if (S.air.some(p => p.dead === 'pile')) $('pile').innerHTML = S.landed.map(leaf).join('');
  if (S.air.some(p => p.dead === 'spill')) $('spill').innerHTML = S.spilled.map(leaf).join('');
  S.air = S.air.filter(p => !p.dead);
  $('air').innerHTML = S.air.map(leaf).join('');

  // completion: dose in range and a short pause, then the lid comes down
  if (!S.done && !S.over && S.count >= LO && S.count <= HI && S.since > 1.4 && S.air.length === 0) S.done = true;
  if (S.done) S.lidY += (0 - S.lidY) * Math.min(1, dt * 7);
  $('lid').setAttribute('opacity', S.done ? 1 : 0);
  $('lid').setAttribute('transform', `translate(0 ${S.lidY.toFixed(1)})`);
  $('target').setAttribute('opacity', S.done ? 0 : (S.count >= LO && !S.over ? 1 : 0.5 + 0.5 * Math.sin(S.t * 3) ** 2));

  // overfill: bowl shudders once
  S.shake = Math.max(0, S.shake - dt * 1.8);
  $('bowlG').setAttribute('transform', `translate(${reduce ? 0 : (Math.sin(S.t * 50) * 4 * S.shake).toFixed(1)},0)`);

  if (S.pop >= 0 && S.popT < 1) { S.popT = Math.min(1, S.popT + dt * 4); drawMeter(); }
  $('done').setAttribute('opacity', S.done ? 1 : 0);
  $('over').setAttribute('opacity', S.over ? 1 : 0);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>

</body>
</html>
