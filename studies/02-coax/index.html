<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coax</title>
<style>
  :root{ --bg:#e6e6e6; --paper:#f7f7f5; --ink:#262626; --mid:#8e8e8e; --faint:#cfcfcf; --stone:#e2e1de; }
  *{box-sizing:border-box} html,body{height:100%;margin:0}
  body{background:var(--bg);display:flex;align-items:center;justify-content:center;
       font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;color:var(--ink);overflow:hidden}
  .phone{height:min(844px,calc(100% - 20px));aspect-ratio:390/844;max-width:100%;
         background:var(--paper);border-radius:34px;overflow:hidden;
         box-shadow:0 0 0 1px var(--faint),0 24px 50px -28px rgba(0,0,0,.4)}
  svg{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
  #fish,#tray{cursor:grab}
  @media(max-width:430px){ .phone{height:100%;border-radius:0;box-shadow:none} }
</style>
</head>
<body>
<div class="phone">
<svg id="stage" viewBox="0 0 390 844" aria-label="Put a fish down and the sleeping cat runs over to eat it">
  <rect width="390" height="844" fill="var(--paper)"/>
  <text x="34" y="74" font-size="13" letter-spacing="2.4" fill="var(--mid)">STUDY 2</text>
  <text x="34" y="112" font-size="30" font-family="Georgia,serif" fill="var(--ink)">Coax</text>
  <text x="34" y="142" font-size="13" fill="var(--mid)">sleek — put the fish down</text>

  <!-- a stretch of paving -->
  <rect x="0" y="430" width="390" height="340" fill="var(--stone)"/>
  <g stroke="var(--faint)" stroke-width="1.5">
    <line x1="0" y1="430" x2="390" y2="430"/><line x1="0" y1="770" x2="390" y2="770"/>
    <line x1="0" y1="540" x2="390" y2="540"/><line x1="0" y1="655" x2="390" y2="655"/>
    <line x1="104" y1="430" x2="104" y2="770"/><line x1="222" y1="430" x2="222" y2="770"/><line x1="326" y1="430" x2="326" y2="770"/>
  </g>

  <g id="fish"></g>
  <g id="cat"></g>
  <g id="zzz" fill="var(--mid)" font-size="16"></g>
  <g id="tray"></g>

  <text x="34" y="812" id="state" font-size="13" fill="var(--mid)">asleep</text>
</svg>
</div>
<script>
(() => {
const svg=document.getElementById('stage'), $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pt=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());};

const TRAY={x:316,y:788}, PEN={x0:56,x1:334,y0:470,y1:740};
const S={ t:0, x:128, y:600, face:-1, wake:0, mode:'rest',
          fish:{out:false,held:false,x:TRAY.x,y:TRAY.y,left:1}, eaten:false,
          target:null, eat:0, stretch:0 };

function curl(x,y){
  const b=Math.sin(S.t*1.1)*2.4;
  return `<ellipse cx="${x}" cy="${y+20}" rx="46" ry="7" fill="#000" opacity=".14"/>
  <g transform="translate(0 ${b.toFixed(2)})">
  <path d="M${x+40} ${y+8} q24 -6 13 -26" fill="none" stroke="var(--ink)" stroke-width="6.5" stroke-linecap="round"/>
  <path d="M${x-46} ${y+13} q-6 -31 25 -36 q33 -6 46 13 q14 20 -6 27 q-33 10 -65 -4 Z" fill="var(--ink)"/>
  <circle cx="${x-16}" cy="${y-8}" r="17" fill="var(--ink)"/>
  <path d="M${x-30} ${y-19} l-3 -14 l14 6 Z" fill="var(--ink)"/>
  <path d="M${x-6} ${y-22} l6 -13 l8 9 Z" fill="var(--ink)"/>
  <path d="M${x-21} ${y-9} q5 4 9 0" fill="none" stroke="var(--paper)" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M${x-16} ${y-2} l-3 3 l3 2 l3 -2 Z" fill="var(--paper)"/>${whisk(x-16,y-8)}</g>`;
}
function run(x,y){
  return `<ellipse cx="${x}" cy="${y+20}" rx="28" ry="6" fill="#000" opacity=".14"/>
  <path d="M${x+25} ${y-16} q21 ${(-9+Math.sin(S.t*8)*8).toFixed(1)} 15 -25" fill="none" stroke="var(--ink)" stroke-width="6.5" stroke-linecap="round"/>
  <path d="M${x-21} ${y-4} q-6 -33 13 -38 q25 -8 33 15 q6 21 -6 23 Z" fill="var(--ink)"/>
  <path d="M${x-13} ${y-6} l${(Math.sin(S.t*15)*7).toFixed(1)} 17 M${x+2} ${y-6} l${(Math.sin(S.t*15+3)*7).toFixed(1)} 17"
        stroke="var(--ink)" stroke-width="4.6" stroke-linecap="round"/>
  <circle cx="${x-4}" cy="${y-33}" r="18" fill="var(--ink)"/>
  <path d="M${x-19} ${y-44} l-2 -15 l14 6 Z" fill="var(--ink)"/>
  <path d="M${x+5} ${y-47} l6 -14 l8 10 Z" fill="var(--ink)"/>
  <circle cx="${x-11}" cy="${y-35}" r="2.3" fill="var(--paper)"/><circle cx="${x+4}" cy="${y-35}" r="2.3" fill="var(--paper)"/>
  <path d="M${x-4} ${y-27} l-3 3 l3 2 l3 -2 Z" fill="var(--paper)"/>${whisk(x-4,y-33)}`;
}
function eat(x,y){
  const nib=Math.sin(S.t*7.5)*2;
  return `<ellipse cx="${x}" cy="${y+20}" rx="34" ry="6" fill="#000" opacity=".14"/>
  <path d="M${x+22} ${y+10} q25 5 17 -12" fill="none" stroke="var(--ink)" stroke-width="6.5" stroke-linecap="round"/>
  <path d="M${x-32} ${y+14} q-7 -28 17 -32 q29 -6 36 13 q8 21 -8 23 Z" fill="var(--ink)"/>
  <circle cx="${x-28}" cy="${(y-6+nib).toFixed(1)}" r="16" fill="var(--ink)"/>
  <path d="M${x-41} ${(y-16+nib).toFixed(1)} l-3 -13 l13 5 Z" fill="var(--ink)"/>
  <path d="M${x-19} ${(y-19+nib).toFixed(1)} l6 -12 l8 9 Z" fill="var(--ink)"/>
  <circle cx="${x-34}" cy="${(y-8+nib).toFixed(1)}" r="2.2" fill="var(--paper)"/>
  <path d="M${x-28} ${(y+1+nib).toFixed(1)} l-3 3 l3 2 l3 -2 Z" fill="var(--paper)"/>${whisk(x-28,y-6+nib)}`;
}
function whisk(hx,hy){
  const f = s => `<path d="M${hx+s*4} ${hy+6} q${s*8} -2 ${s*16} -5"/>
                  <path d="M${hx+s*5} ${hy+9} q${s*8} 1 ${s*17} 1"/>
                  <path d="M${hx+s*4} ${hy+12} q${s*8} 4 ${s*16} 8"/>`;
  return `<g fill="none" stroke="var(--paper)" stroke-width="1.2" stroke-linecap="round" opacity=".85">${f(-1)}${f(1)}</g>`;
}

function draw(){
  const tf=`translate(${S.x.toFixed(1)} ${S.y.toFixed(1)}) scale(${(-S.face*1.3).toFixed(2)} 1.3) translate(${(-S.x).toFixed(1)} ${(-S.y).toFixed(1)})`;
  $('cat').setAttribute('transform',tf); $('zzz').setAttribute('transform',tf);
  $('cat').innerHTML = S.mode==='run' ? run(S.x,S.y) : S.mode==='eat' ? eat(S.x,S.y) : curl(S.x,S.y);

  const f=S.fish, fx=f.out?f.x:TRAY.x, fy=f.out?f.y:TRAY.y, w=f.out?f.left:(S.eaten?0:1);
  const wob=f.held?Math.sin(S.t*9)*6:Math.sin(S.t*1.7)*2;
  $('fish').innerHTML = w<=.02 ? '' : `
    <g transform="translate(${fx.toFixed(1)} ${fy.toFixed(1)}) rotate(${wob.toFixed(1)}) scale(${(.95+w*.6).toFixed(2)})">
      <path d="M-16 0 q10 -12 21 0 q-11 12 -21 0 Z" fill="var(--ink)"/>
      <path d="M-16 0 l-11 -8 v16 Z" fill="var(--ink)"/>
      <circle cx="0" cy="-2" r="1.8" fill="var(--paper)"/></g>`;
  $('tray').innerHTML = (f.out||S.eaten) ? '' : `
    <circle cx="${TRAY.x}" cy="${TRAY.y}" r="28" fill="none" stroke="var(--ink)" stroke-width="1.5"
            stroke-dasharray="3 6" opacity="${(.4+Math.sin(S.t*2.2)*.22).toFixed(2)}"/>`;

  if(S.mode==='rest' && S.wake<.2){
    let z=''; for(let i=0;i<3;i++){ const p=((S.t*.35+i*.33)%1);
      z+=`<text x="${(S.x+32+p*24).toFixed(0)}" y="${(S.y-30-p*60).toFixed(0)}" font-size="${12+i*5}" opacity="${((1-p)*.8).toFixed(2)}">z</text>`; }
    $('zzz').innerHTML=z;
  } else $('zzz').innerHTML='';

  $('state').textContent = S.mode==='run' ? 'she has seen it'
                         : S.mode==='eat' ? 'eating'
                         : S.eaten ? 'asleep where she ate' : 'asleep';
}

const onFish = p => { if(S.eaten) return false;
  const f=S.fish, x=f.out?f.x:TRAY.x, y=f.out?f.y:TRAY.y; return Math.hypot(p.x-x,p.y-y)<38; };
svg.addEventListener('pointerdown', e=>{ const p=pt(e); if(!onFish(p)) return;
  S.fish.held=true; S.fish.out=true; S.fish.left=1;
  S.fish.x=clamp(p.x===TRAY.x?TRAY.x-120:p.x,60,330); S.fish.y=clamp(p.y,PEN.y0,PEN.y1);
  svg.setPointerCapture(e.pointerId); });
svg.addEventListener('pointermove', e=>{ if(!S.fish.held) return; const p=pt(e);
  S.fish.x=clamp(p.x,60,330); S.fish.y=clamp(p.y,PEN.y0,PEN.y1); });
addEventListener('pointerup', ()=>S.fish.held=false);
addEventListener('pointercancel', ()=>S.fish.held=false);

let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now; S.t+=dt;
  const f=S.fish;
  if(f.out && !f.held && f.left>.02 && S.mode!=='eat'){
    const side = f.x > 195 ? -1 : 1;
    S.mode='run'; S.target={x:clamp(f.x+side*82,PEN.x0,PEN.x1), y:clamp(f.y,PEN.y0,PEN.y1)};
  }
  if(S.mode==='run' && S.target){
    const dx=S.target.x-S.x, dy=S.target.y-S.y, d=Math.hypot(dx,dy);
    if(d>4) S.face = dx<0 ? -1 : 1;
    if(d<6){ S.mode='eat'; S.eat=2.2; S.target=null; }
    else { const v=168*dt; S.x+=dx/d*v; S.y+=dy/d*v; }
  }
  if(S.mode==='eat'){ S.eat-=dt; S.fish.left=clamp(S.eat/2.2,0,1);
    if(S.eat<=0){ S.fish.out=false; S.fish.left=0; S.eaten=true; S.mode='rest'; } }
  const busy = S.mode==='run'||S.mode==='eat';
  S.wake = busy ? Math.min(1,S.wake+dt*4) : Math.max(0,S.wake-dt*1.4);
  draw(); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.CAT=()=>S;
})();
</script>
</body>
</html>
