<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pour the Tea</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one 390×844 phone frame, centred and scaled to fit; everything inside is one SVG. Single grayscale look on purpose. */
:root{
  --room:#cfcfcf; --screen:#f1f1f1; --ink:#1b1b1b; --mid:#7d7d7d; --soft:#bdbdbd; --faint:#e2e2e2;
  --ui:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
html,body{height:100%}
body{margin:0;background:var(--room);color:var(--ink);display:flex;align-items:center;justify-content:center;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));box-sizing:border-box;overflow:hidden}
.phone{height:min(844px, calc(100% - 24px));aspect-ratio:390/844;max-width:100%;background:var(--screen);border-radius:36px;overflow:hidden;box-shadow:0 0 0 1px var(--soft)}
svg{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;font-family:var(--ui)}
.hit{cursor:grab;outline:none}
.hit.drag{cursor:grabbing}
.hit:focus-visible .focus{stroke:var(--ink);stroke-dasharray:4 4}
@media (max-width:430px){ .phone{border-radius:0;box-shadow:none;height:100%} body{padding-left:0;padding-right:0} }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
</head>
<body>

<div class="phone">
<svg id="s" viewBox="0 0 390 844" aria-label="Interaction study: drag the gaiwan to tilt it and pour the tea into the pitcher">
  <defs>
    <clipPath id="bowlClip" clipPathUnits="userSpaceOnUse"><path id="bowlClipPath" d="M74 282 Q79 356 140 356 Q201 356 206 282 Z"/></clipPath>
    <clipPath id="potClip" clipPathUnits="userSpaceOnUse"><path d="M219 534 L321 534 L312 686 Q270 695 228 686 Z"/></clipPath>
    <linearGradient id="scale" x1="0" x2="1">
      <stop offset="0" stop-color="#e6e6e6"/><stop offset="1" stop-color="#2a2a2a"/>
    </linearGradient>
  </defs>
  <text x="28" y="66" font-size="12" fill="var(--mid)" letter-spacing="1.2">STUDY 3 / 3</text>
  <text x="28" y="88" font-size="17" fill="var(--ink)" font-weight="500">Pour the tea</text>
  <g id="reset" class="hit" tabindex="0" role="button" aria-label="Reset" style="cursor:pointer">
    <circle class="focus" cx="352" cy="74" r="20" fill="var(--faint)" stroke="none"/>
    <path d="M361 74a9 9 0 1 1-3-6.7" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/>
    <path d="M358.5 62.5v5.5h-5.5" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- steep timer: 0–30 s, target window 10–20 s -->
  <g id="timer">
    <circle cx="95" cy="600" r="32" fill="none" stroke="var(--faint)" stroke-width="8"/>
    <path id="tWin" d="" fill="none" stroke="var(--soft)" stroke-width="16"/>
    <path id="tArc" d="" fill="none" stroke="var(--ink)" stroke-width="8" stroke-linecap="round"/>
    <text id="tTxt" x="95" y="605" font-size="15" text-anchor="middle" fill="var(--ink)" font-weight="500" style="font-variant-numeric:tabular-nums">0s</text>
    <text x="95" y="656" font-size="11" text-anchor="middle" fill="var(--mid)">10–20 s</text>
  </g>

  <!-- guide arc from lip to pitcher: cue that appears in the window -->
  <path id="guide" d="M214 276 Q262 300 268 520" fill="none" stroke="var(--soft)" stroke-width="2" stroke-dasharray="4 7" opacity="0"/>

  <!-- pitcher -->
  <g id="pot">
    <rect id="potTea" x="200" y="690" width="140" height="10" fill="#888" clip-path="url(#potClip)"/>
    <path d="M216 530 L324 530 L314 690 Q270 700 226 690 Z" fill="none" stroke="var(--ink)" stroke-width="4" stroke-linejoin="round"/>
    <path d="M216 530 L202 518" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>
    <path d="M324 556 q26 6 22 44 q-3 26 -26 30" fill="none" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>
  </g>

  <path id="stream" d="" fill="none" stroke="#888" stroke-linecap="round" stroke-width="0"/>

  <!-- gaiwan: the drag target -->
  <g id="gwHit" class="hit" tabindex="0" role="slider" aria-label="Gaiwan. Drag right or down to tilt and pour. Arrow keys also tilt." aria-valuemin="0" aria-valuemax="115" aria-valuenow="0">
    <rect class="focus" x="40" y="200" width="200" height="200" rx="24" fill="transparent" stroke="none"/>
    <rect id="bowlTea" x="0" y="290" width="390" height="200" fill="#ccc" clip-path="url(#bowlClip)"/>
    <g id="gw">
      <path d="M70 280 Q75 360 140 360 Q205 360 210 280" fill="none" stroke="var(--ink)" stroke-width="5" stroke-linejoin="round"/>
      <path d="M100 360 L100 372 L180 372 L180 360" fill="none" stroke="var(--ink)" stroke-width="4"/>
      <!-- lid held slightly open on the pouring side -->
      <g transform="rotate(-8 80 276)">
        <path d="M76 274 Q140 226 204 274 Z" fill="var(--screen)" stroke="var(--ink)" stroke-width="4" stroke-linejoin="round"/>
        <rect x="128" y="234" width="24" height="12" rx="5" fill="var(--ink)"/>
      </g>
    </g>
    <circle id="grip" cx="140" cy="300" r="0" fill="var(--ink)" opacity=".08"/>
  </g>
  <g id="steam" fill="none" stroke="var(--soft)" stroke-width="3" stroke-linecap="round"></g>

  <!-- result: tea strength scale -->
  <g id="result">
    <rect x="60" y="752" width="270" height="14" rx="7" fill="url(#scale)"/>
    <rect id="win" x="0" y="744" width="0" height="30" rx="8" fill="none" stroke="var(--ink)" stroke-width="2"/>
    <text x="60" y="796" font-size="11" fill="var(--mid)">light</text>
    <text x="330" y="796" font-size="11" fill="var(--mid)" text-anchor="end">strong</text>
    <path id="marker" d="M0 0 l-8 -12 h16 Z" fill="var(--ink)" opacity="0"/>
    <g id="verdict" opacity="0"></g>
  </g>
</svg>
</div>

<script>
const $ = id => document.getElementById(id);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const PIV = [210, 280];                 // the pouring lip; the bowl rotates about it
const TSPAN = 30, WIN = [10, 20], SMAX = 35;
const shade = t => Math.round(228 - Math.min(1, t / SMAX) * 186);   // gray value of the brew after t seconds
const scaleX = t => 60 + Math.min(1, t / SMAX) * 270;
$('win').setAttribute('x', scaleX(WIN[0]) - 4); $('win').setAttribute('width', scaleX(WIN[1]) - scaleX(WIN[0]) + 8);

function arc(cx, cy, r, a0, a1) {
  const p = a => [cx + r * Math.sin(a), cy - r * Math.cos(a)];
  const [x0, y0] = p(a0), [x1, y1] = p(a1);
  return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
}
$('tWin').setAttribute('d', arc(95, 600, 32, WIN[0] / TSPAN * 2 * Math.PI, WIN[1] / TSPAN * 2 * Math.PI));

let S;
function reset() {
  S = { t: 0, ang: 0, target: 0, drag: null, v: 1, pv: 0, pShadeSum: 0, done: false, clock: 0, grip: 0, resist: 0 };
  $('marker').setAttribute('opacity', 0); $('verdict').setAttribute('opacity', 0);
}
reset();

const svg = $('s'), hit = $('gwHit');
const toSvg = e => { const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); };
hit.addEventListener('pointerdown', e => {
  if (S.done) return;
  const p = toSvg(e); S.drag = { x: p.x, y: p.y }; $('grip').setAttribute('cx', p.x); $('grip').setAttribute('cy', p.y); hit.setPointerCapture(e.pointerId); hit.classList.add('drag');
});
hit.addEventListener('pointermove', e => {
  if (!S.drag) return;
  const p = toSvg(e); $('grip').setAttribute('cx', p.x); $('grip').setAttribute('cy', p.y); const d = (p.x - S.drag.x) * 0.55 + (p.y - S.drag.y) * 0.45;
  if (d < 0) { S.target = Math.max(-6, d * 0.08); S.resist = 1; }   // wrong direction: elastic, barely moves
  else { S.target = Math.min(115, d * 0.75); S.resist = 0; }
});
const end = () => { S.drag = null; S.target = 0; hit.classList.remove('drag'); };
hit.addEventListener('pointerup', end); hit.addEventListener('pointercancel', end); hit.addEventListener('lostpointercapture', end);
hit.addEventListener('keydown', e => {
  if (S.done) return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); S.target = Math.min(115, S.target + 12); }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); S.target = Math.max(0, S.target - 12); }
});
$('reset').addEventListener('click', reset);
$('reset').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); reset(); } });

const gray = g => `rgb(${g},${g},${g})`;
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; S.clock += dt;
  if (!S.done) S.t += dt;
  const brew = shade(S.t);

  // tilt follows the finger with a little lag (weight), springs back on release
  S.ang += (S.target - S.ang) * Math.min(1, dt * (S.drag ? 10 : 6));
  let idle = 0;
  if (!S.drag && !S.done && S.t >= WIN[0] && !reduce) idle = 5 * Math.max(0, Math.sin(S.clock * 2.4)) ** 6;  // nudge cue inside the window
  const a = S.ang + idle;
  const tf = `rotate(${a.toFixed(2)} ${PIV[0]} ${PIV[1]})`;
  $('gw').setAttribute('transform', tf);
  $('bowlClipPath').setAttribute('transform', tf);
  hit.setAttribute('aria-valuenow', Math.round(S.ang));

  // pouring: the fuller the bowl, the less tilt it needs before tea reaches the lip
  const thr = 22 + (1 - S.v) * 78;
  const flow = S.done ? 0 : Math.max(0, Math.min(1.2, (S.ang - thr) / 28));
  const dv = Math.min(S.v, flow * 0.42 * dt);
  S.v -= dv; S.pv += dv; S.pShadeSum += dv * brew;

  // tea surface stays level in world space; clipped by the rotated bowl
  const upright = 356 - S.v * 66;
  const top = S.v < 0.005 ? 600 : PIV[1] + (upright - PIV[1]) * Math.max(0, Math.min(1, 1 - S.ang / thr));
  $('bowlTea').setAttribute('y', top.toFixed(1)); $('bowlTea').setAttribute('fill', gray(brew));

  // pitcher fills with the mix of everything poured so far
  const pShade = S.pv > 0 ? S.pShadeSum / S.pv : brew;
  const pTop = 686 - S.pv * 140;
  $('potTea').setAttribute('y', pTop.toFixed(1)); $('potTea').setAttribute('height', (700 - pTop).toFixed(1));
  $('potTea').setAttribute('fill', gray(Math.round(pShade)));

  // stream: thickness = flow
  if (flow > 0.01) {
    $('stream').setAttribute('d', `M${PIV[0] + 2} ${PIV[1] + 2} Q${PIV[0] + 34} ${PIV[1] + 14} ${258 + flow * 6} ${Math.max(540, pTop)}`);
    $('stream').setAttribute('stroke-width', (2 + flow * 7).toFixed(1));
    $('stream').setAttribute('stroke', gray(brew));
  } else $('stream').setAttribute('stroke-width', 0);

  // grip disc under the finger
  S.grip += ((S.drag ? 34 : 0) - S.grip) * Math.min(1, dt * 10);
  $('grip').setAttribute('r', S.grip.toFixed(1));

  // guide arc appears once the steep enters the window, until pouring starts
  $('guide').setAttribute('opacity', !S.done && S.t >= WIN[0] && S.pv < 0.02 ? 0.5 + 0.5 * Math.sin(S.clock * 3) ** 2 : 0);

  // steep timer
  const tt = Math.min(S.t, TSPAN);
  $('tArc').setAttribute('d', tt > 0.05 ? arc(95, 600, 32, 0, Math.min(tt / TSPAN, 0.9999) * 2 * Math.PI) : '');
  $('tTxt').textContent = Math.floor(S.t) + 's';

  // steam over the bowl while it is full
  let st = '';
  if (S.v > 0.05 && Math.abs(S.ang) < 30) for (let i = 0; i < 3; i++) {
    const x = 116 + i * 24; let d = `M${x} 222`;
    for (let k = 1; k <= 5; k++) d += ` L${(x + Math.sin(S.clock * 3 + i + k) * 5).toFixed(1)} ${222 - k * 9}`;
    st += `<path d="${d}" opacity="${(S.v * 0.8).toFixed(2)}"/>`;
  }
  $('steam').innerHTML = st;

  // completion: the bowl is empty -> show where this cup lands on the strength scale
  if (!S.done && S.v < 0.02 && S.pv > 0.5) {
    S.done = true; end();
    const tEq = (228 - pShade) / 186 * SMAX;            // brew time this cup's shade corresponds to
    const x = scaleX(tEq), good = tEq >= WIN[0] && tEq <= WIN[1];
    $('marker').setAttribute('transform', `translate(${x.toFixed(1)} 748)`);
    $('marker').setAttribute('opacity', 1);
    $('verdict').innerHTML = good
      ? `<circle cx="195" cy="420" r="22" fill="var(--ink)"/><path d="M185 420 l7 7 l13 -14" fill="none" stroke="var(--screen)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>`
      : `<circle cx="195" cy="420" r="22" fill="none" stroke="var(--ink)" stroke-width="3"/><path d="M187 412 l16 16 M203 412 l-16 16" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>`;
    $('verdict').setAttribute('opacity', 1);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>

</body>
</html>
